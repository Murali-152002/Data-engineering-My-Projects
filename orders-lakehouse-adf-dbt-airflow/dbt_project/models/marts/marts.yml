version: 2

models:
  - name: dim_customer
    description: One row per customer, derived from observed order activity.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_product
    description: One row per product with its most recently observed price.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: Date spine covering the observed order date range.
    columns:
      - name: order_date
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: Grain is one row per order. Star-schema fact table joining to dim_customer, dim_product, dim_date.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: order_date
